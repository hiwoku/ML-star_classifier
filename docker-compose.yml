services:
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow          # experiments + registry survive restarts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      retries: 10
      
  trainer:
    build: .
    profiles: ["train"]
    command: python train.py
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_DISABLE_AGENT_HINT: "1"
    volumes:
      - ./:/app
    depends_on:
      mlflow:
        condition: service_healthy


  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_URI: models:/star-classifier@champion   # falls back to models/model.joblib if unavailable
    depends_on:
      mlflow:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000             # how the app reaches the API inside Docker
      MLFLOW_URL: http://mlflow:5000       # reads experiment results for the "How the model works" tab
      API_PUBLIC_URL: http://localhost:8000      # links opened in your browser
      MLFLOW_PUBLIC_URL: http://localhost:5000
    depends_on:
      - api
      - mlflow

volumes:
  mlflow-data:
